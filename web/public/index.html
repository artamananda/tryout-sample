<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Teras Belajar Asik adalah platform belajar online gratis untuk persiapan ujian masuk perguruan tinggi dan kedinasan. Dapatkan soal tryout, solusi lengkap, dan analisis performa untuk meningkatkan peluang sukses Anda."
    />
    <meta
      name="keywords"
      content="Teras Belajar Asik, telisik.go, telisik, platform belajar online, persiapan ujian perguruan tinggi, tryout kedinasan, persiapan tes masuk, belajar online efektif, ujian kedinasan, tryout gratis"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>%REACT_APP_WEBSITE_NAME%</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
