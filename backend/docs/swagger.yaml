basePath: /v1/api
definitions:
  model.CheckByEmailRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  model.CreateEbookRequest:
    properties:
      author:
        type: string
      category:
        type: string
      cover_image_url:
        type: string
      description:
        type: string
      ebook_url:
        type: string
      is_published:
        type: boolean
      isbn:
        type: string
      publication_date:
        type: string
      publisher:
        type: string
      title:
        type: string
      total_pages:
        type: integer
    required:
    - author
    - title
    type: object
  model.CreateProgramRequest:
    properties:
      close_registration:
        type: string
      description:
        type: string
      end_time:
        type: string
      is_published:
        type: boolean
      max_participants:
        type: integer
      name:
        type: string
      open_registration:
        type: string
      picture_url:
        type: string
      start_time:
        type: string
    type: object
  model.CreateQuestionRequest:
    properties:
      correct_answer:
        type: string
      image_url:
        type: string
      is_options:
        type: boolean
      local_id:
        type: integer
      options:
        items:
          type: string
        type: array
      points:
        type: integer
      text:
        type: string
      type:
        type: string
    required:
    - correct_answer
    - text
    type: object
  model.CreateTransactionProgramRequest:
    properties:
      motivation:
        type: string
      program_id:
        type: string
      status:
        type: string
      user_id:
        type: string
    type: object
  model.CreateTransactionTryoutRequest:
    properties:
      tryout_id:
        type: string
      user_id:
        type: string
    type: object
  model.CreateTryoutRequest:
    properties:
      duration:
        minimum: 1
        type: integer
      end_time:
        type: string
      is_published:
        type: boolean
      start_time:
        type: string
      title:
        type: string
    required:
    - duration
    - end_time
    - is_published
    - start_time
    - title
    type: object
  model.CreateUserAnswerRequest:
    properties:
      question_id:
        type: string
      tryout_id:
        type: string
      user_answer:
        type: string
      user_id:
        type: string
    type: object
  model.CreateUserOtpRequest:
    properties:
      email:
        type: string
      name:
        type: string
      username:
        type: string
    type: object
  model.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  model.GeneralResponse:
    properties:
      code:
        type: integer
      message:
        type: string
      payload: {}
    type: object
  model.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  model.RegisterRequest:
    properties:
      email:
        type: string
      grade:
        type: string
      name:
        type: string
      nisn:
        type: string
      password:
        type: string
      picture_url:
        type: string
      province:
        type: string
      regency:
        type: string
      role:
        type: string
      school:
        type: string
      username:
        type: string
    required:
    - email
    - name
    - password
    - role
    - username
    type: object
  model.ResetPasswordRequest:
    properties:
      email:
        type: string
      new_password:
        minLength: 6
        type: string
      otp:
        type: string
    required:
    - email
    - new_password
    - otp
    type: object
  model.SelfRegisterRequest:
    properties:
      email:
        type: string
      grade:
        type: string
      name:
        type: string
      nisn:
        type: string
      otp:
        type: string
      password:
        type: string
      picture_url:
        type: string
      province:
        type: string
      regency:
        type: string
      school:
        type: string
      username:
        type: string
    required:
    - email
    - name
    - otp
    - password
    - username
    type: object
  model.UpdateEbookRequest:
    properties:
      author:
        type: string
      category:
        type: string
      cover_image_url:
        type: string
      description:
        type: string
      ebook_url:
        type: string
      is_published:
        type: boolean
      isbn:
        type: string
      publication_date:
        type: string
      publisher:
        type: string
      title:
        type: string
      total_pages:
        type: integer
    type: object
  model.UpdateProgramRequest:
    properties:
      close_registration:
        type: string
      description:
        type: string
      end_time:
        type: string
      is_published:
        type: boolean
      max_participants:
        type: integer
      name:
        type: string
      open_registration:
        type: string
      picture_url:
        type: string
      program_id:
        type: string
      start_time:
        type: string
    type: object
  model.UpdateQuestionRequest:
    properties:
      correct_answer:
        type: string
      image_url:
        type: string
      is_options:
        type: boolean
      local_id:
        type: integer
      options:
        items:
          type: string
        minItems: 1
        type: array
      points:
        type: integer
      text:
        type: string
      type:
        type: string
    type: object
  model.UpdateStatusTransactionTryoutRequest:
    properties:
      token:
        type: string
      tryout_id:
        type: string
      user_id:
        type: string
    type: object
  model.UpdateTransactionProgramRequest:
    properties:
      motivation:
        type: string
      program_id:
        type: string
      status:
        type: string
      user_id:
        type: string
      user_program_id:
        type: string
    type: object
  model.UpdateTransactionTryoutRequest:
    properties:
      end_time:
        type: string
      start_time:
        type: string
      status:
        type: string
      token:
        type: string
      transaction_tryout_id:
        type: string
      tryout_id:
        type: string
      user_id:
        type: string
    type: object
  model.UpdateTryoutRequest:
    properties:
      duration:
        type: integer
      end_time:
        type: string
      is_published:
        type: boolean
      start_time:
        type: string
      title:
        type: string
    type: object
  model.UpdateUserAnswerRequest:
    properties:
      question_id:
        type: string
      tryout_id:
        type: string
      user_answer:
        type: string
      user_id:
        type: string
    type: object
  model.UpdateUserRequest:
    properties:
      email:
        type: string
      grade:
        type: string
      last_login:
        type: string
      name:
        type: string
      nisn:
        type: string
      picture_url:
        type: string
      province:
        type: string
      regency:
        type: string
      role:
        description: Password   string    `json:"password"`
        type: string
      school:
        type: string
      username:
        type: string
    type: object
